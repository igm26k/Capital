events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;
  include /etc/nginx/mime.types;
  server {
    client_max_body_size 14m;
    listen 443 ssl;
    set $api_backend api:8080;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    root /usr/share/nginx/html;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ {
      proxy_pass http://$api_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /health/ { proxy_pass http://$api_backend; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
