x-backend: &backend
  build: ./backend
  environment: &backend-env
    APP_ENV: local
    DATABASE_URL: postgres://${POSTGRES_USER:-accounting}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-accounting}?sslmode=disable
    HTTP_ADDR: 0.0.0.0:8080
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
    REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
    SYNC_CURSOR_ACTIVE_KEY: ${SYNC_CURSOR_ACTIVE_KEY:-}
    SYNC_CURSOR_KEYS: ${SYNC_CURSOR_KEYS:-}
    AUTH_HASH_CONCURRENCY: ${AUTH_HASH_CONCURRENCY:-2}
    AUTH_IP_ATTEMPTS_PER_MINUTE: ${AUTH_IP_ATTEMPTS_PER_MINUTE:-100}
    AUTH_EMAIL_ATTEMPTS_PER_MINUTE: ${AUTH_EMAIL_ATTEMPTS_PER_MINUTE:-20}
  networks: [private]
services:
  db:
    image: postgres:18.0-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accounting}
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["db-data:/var/lib/postgresql"]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [/app/migrate]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    command: [/app/api]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *backend
    command: [/app/worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: {context: ./web, target: production, network: "${DOCKER_BUILD_NETWORK:-default}"}
    ports: ["127.0.0.1:${WEB_PORT:-8443}:443"]
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/.runtime/tls:/etc/nginx/tls:ro
    networks: [private]
    depends_on: [api]
networks:
  private: {}
volumes:
  db-data: {}
